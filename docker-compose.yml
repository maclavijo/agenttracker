services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agenttracker
      POSTGRES_PASSWORD: agenttracker
      POSTGRES_DB: agenttracker
    ports:
      - '5438:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agenttracker -d agenttracker']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
