name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenttracker
          POSTGRES_PASSWORD: agenttracker
          POSTGRES_DB: agenttracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenttracker -d agenttracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agenttracker:agenttracker@localhost:5432/agenttracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate
        run: npm run db:migrate
      - name: Test
        run: npm test
